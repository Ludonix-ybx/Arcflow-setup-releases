    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6734D7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#4DA3FF"/>
      <stop offset="100%" stop-color="#CD43BA" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" fill-opacity="0.06"/>
    </pattern>
    <clipPath id="card">
      <rect x="1" y="1" width="858" height="238" rx="12"/>
    </clipPath>
  </defs>

